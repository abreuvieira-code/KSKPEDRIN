<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog de NARUTOOOO</title>
   
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #e2e8f0;
            line-height: 1.7;
        }
        header {
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            color: white;
            text-align: center;
            padding: 50px 20px;
            box-shadow: 0 4px 20px rgba(185, 28, 28, 0.4);
        }
        h1 {
            margin: 0;
            font-size: 3.2em;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            background-color: #1e2937;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(185, 28, 28, 0.3);
        }
        .imagem-naruto img {
            max-width: 100%;
            width: 650px;
            height: auto;
            border-radius: 20px;
            border: 6px solid #f59e0b;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s;
        }
        .imagem-naruto img:hover {
            transform: scale(1.03);
        }
        h2 {
            color: #f59e0b;
            border-bottom: 3px solid #f59e0b;
            padding-bottom: 10px;
            margin-top: 35px;
        }
        p { font-size: 1.1em; }

        /* Botão de Like - MAIS DESTAQUE */
        .like-container {
            text-align: center;
            margin: 50px 0 30px 0;
        }
        .like-button {
            background-color: #b91c1c;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.4em;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(185, 28, 28, 0.5);
            font-weight: bold;
        }
        .like-button:hover {
            background-color: #f59e0b;
            color: #1e2937;
            transform: scale(1.1);
        }
        .like-button.liked {
            background-color: #f59e0b;
            color: #1e2937;
            animation: pop 0.5s;
        }
        .heart {
            font-size: 2em;
            transition: all 0.3s;
        }
        .like-button.liked .heart {
            animation: heartBeat 0.6s ease;
            color: #ef4444;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            40% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }

        .like-count {
            font-size: 1.3em;
            min-width: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu Blog de NARUTOOOO 🔥</h1>
        <p><strong>Olá, sou o futuro Hokage, tô certo!</strong> 🌀</p>
    </header>

    <main>
        <!-- Seu conteúdo anterior continua aqui... -->

        <div class="like-container">
            <button class="like-button" id="likeBtn">
                <span class="heart">❤️</span>
                <span class="like-count" id="likeCount">0</span>
                <span>Dattebayo!</span>
            </button>
        </div>
    </main>

    <script>
        const likeBtn = document.getElementById('likeBtn');
        const likeCount = document.getElementById('likeCount');
        let count = 1247;     // número inicial (pode mudar)
        let liked = false;

        likeCount.textContent = count.toLocaleString('pt-BR');

        likeBtn.addEventListener('click', () => {
            if (!liked) {
                count++;
                liked = true;
                likeBtn.classList.add('liked');
            } else {
                count--;
                liked = false;
                likeBtn.classList.remove('liked');
            }
            likeCount.textContent = count.toLocaleString('pt-BR');
        });
    </script>
</body>
</html>
